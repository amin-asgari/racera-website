<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#141218" />
    <title>Racera — Offline</title>
    <style>
      html { color-scheme: dark; background: #141218; font-family: system-ui, sans-serif; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { max-width: 420px; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: #a7a4ab; line-height: 1.55; }
      a { display: inline-flex; margin-top: 24px; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 16px; background: #ff3b30; color: white; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Previously loaded Racera data stays available in the app. Reconnect and try again to refresh it.</p>
      <a href="/web-app/#/home">Open Racera</a>
    </main>
  </body>
</html>
